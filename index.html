<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>90-Day Reset and Build</title>
<link rel="stylesheet" href="style.css">
<link rel="shortcut icon" href="./icon-1.png" type="image/x-icon">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title-row">
      <div><h1>90-Day Reset and Build</h1><p class="sub">Oct 1 to Dec 29, 2026. Return, rebuild, rise.</p></div>
      <div class="save" id="save" data-state="idle">Ready</div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="grid-wrap" id="grid"></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-v="day">Day</button>
      <button role="tab" data-v="week">Week</button>
      <button role="tab" data-v="plan">Plan</button>
    </nav>
  </header>
  <main id="main"></main>
</div>
<script src="app.js"></script>
</body>
</html>
